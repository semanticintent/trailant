[project]
name = "trailant"
version = "0.1.0"
description = "A local-first trail index for AI coding sessions — resume, self-log, and cadence tracking across vendors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
trailant = "trailant.cli:main"
ant = "trailant.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
